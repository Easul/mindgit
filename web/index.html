<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>MindGit</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css" id="hljs-dark">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github.min.css" id="hljs-light" disabled>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <link rel="stylesheet" href="/vendor/mxgraph/css/common.css" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="app">
      <header>
        <div class="brand">MindGit</div>
        <div class="view-toggle">
          <button id="worktree-view" class="active" type="button">Working Tree</button>
          <button id="history-view" type="button">History</button>
        </div>
        <div class="stat">Branch: <strong id="branch">-</strong></div>
        <div class="stat">Modified: <strong id="modified">0</strong></div>
        <div class="stat">Added: <strong id="added">0</strong></div>
        <div class="stat">Deleted: <strong id="deleted">0</strong></div>
        <div class="stat"><strong id="lines">+0 -0</strong></div>
        <button id="theme-toggle" type="button">Light</button>
        <button id="refresh" type="button">Refresh</button>
        <div class="grow"></div>
        <form class="search" id="search-form">
          <input id="search" placeholder="Search with keyword" autocomplete="off" />
          <button type="submit">Search</button>
        </form>
      </header>

      <main>
        <aside>
          <div class="pane-title">
            <span id="change-title">Changes (0)</span>
            <button id="tree-root-menu" class="pane-action" type="button" title="Root actions">...</button>
          </div>
          <div class="file-list" id="file-list"></div>
        </aside>
        <div class="layout-resizer layout-resizer-vertical" id="left-pane-resizer" aria-hidden="true"></div>

        <section>
          <div class="viewer-split-area" id="viewer-split-area">
            <div class="editor-pane primary-editor-pane">
              <div class="file-tabs" id="file-tabs"></div>
              <div id="viewer"><div class="empty">No file selected</div></div>
            </div>
            <div class="split-pane-resizer" id="split-pane-resizer" hidden aria-hidden="true"></div>
            <div class="split-pane-host" id="split-pane-host" hidden></div>
          </div>
        </section>
        <div class="layout-resizer layout-resizer-vertical" id="right-pane-resizer" aria-hidden="true"></div>

        <div class="review">
          <div class="pane-title"><span>Review</span></div>
          <div class="review-body">
            <div class="card">
              <h3>File Review</h3>
              <p id="review-summary">选择文件后，这里会显示变更摘要、风险提示和快速操作入口。</p>
            </div>
            <div class="card">
              <h3>Search Results</h3>
              <div class="search-results" id="search-results"><p>输入关键词后全局搜索。</p></div>
            </div>
          </div>
        </div>
      </main>

      <footer>
        <span id="root">-</span>
        <span class="message" id="message"></span>
      </footer>
    </div>

    <script src="/utils.js"></script>
    <script src="/history.js"></script>
    <script src="/tree.js"></script>
    <script>window.mxBasePath = '/vendor/mxgraph';</script>
    <script src="/vendor/mxgraph/mxClient.min.js"></script>
    <script src="/diagram.js"></script>
    <script src="/viewer.js"></script>
    <script src="/editor.js"></script>
    <script src="/app.js"></script>
  </body>
</html>
