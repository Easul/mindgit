<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>MindGit</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css" id="hljs-dark">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github.min.css" id="hljs-light" disabled>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <style>
      :root {
        color-scheme: dark;
        --bg: #0d1117;
        --panel: #161b22;
        --panel-2: #0f1520;
        --surface: #0d1117;
        --button: #21262d;
        --button-primary: #238636;
        --button-primary-border: #2ea043;
        --input: #0d1117;
        --line: #30363d;
        --text: #e6edf3;
        --muted: #8b949e;
        --blue: #58a6ff;
        --yellow: #d29922;
        --green: #3fb950;
        --red: #f85149;
        --active: #1f6feb22;
        --diff-add-text: #aff5b4;
        --diff-add-bg: #033a16;
        --diff-del-text: #ffdcd7;
        --diff-del-bg: #67060c;
        --shadow: none;
      }

      :root[data-theme="light"] {
        color-scheme: light;
        --bg: #f4f0e8;
        --panel: #fffaf0;
        --panel-2: #f8f2e7;
        --surface: #fffdf7;
        --button: #efe6d6;
        --button-primary: #1f7a4d;
        --button-primary-border: #2b9460;
        --input: #fffdf7;
        --line: #d8cab6;
        --text: #262016;
        --muted: #746957;
        --blue: #0b63b6;
        --yellow: #9a6700;
        --green: #1a7f37;
        --red: #cf222e;
        --active: #0b63b618;
        --diff-add-text: #14532d;
        --diff-add-bg: #dafbe1;
        --diff-del-text: #82071e;
        --diff-del-bg: #ffebe9;
        --shadow: 0 18px 40px rgba(72, 52, 24, .08);
      }

      * { box-sizing: border-box; }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font: 14px/1.4 ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      button, input, textarea { font: inherit; }
      button {
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--button);
        color: var(--text);
        padding: 7px 12px;
        cursor: pointer;
      }
      button:hover { border-color: var(--blue); }
      button.primary { background: transparent; border-color: var(--blue); color: var(--blue); font-weight: 600; }
      button.primary:hover { background: var(--active); border-color: var(--blue); }
      button.danger { color: var(--red); }

      .app {
        display: grid;
        grid-template-rows: auto 1fr auto;
        height: 100vh;
        overflow: hidden;
      }

      header {
        display: flex;
        align-items: center;
        gap: 16px;
        padding: 12px 16px;
        border-bottom: 1px solid var(--line);
        background: var(--panel);
      }
      .brand { font-weight: 750; letter-spacing: .3px; }
      .view-toggle { display: flex; gap: 6px; }
      .view-toggle button.active { border-color: var(--blue); color: var(--blue); }
      .stat { color: var(--muted); }
      .stat strong { color: var(--text); font-weight: 650; }
      .grow { flex: 1; }
      .search { display: flex; gap: 8px; min-width: 360px; }
      input {
        width: 100%;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--input);
        color: var(--text);
        padding: 8px 10px;
      }

      main {
        display: grid;
        grid-template-columns: 240px minmax(0, 1fr) 260px;
        overflow: hidden;
      }
      aside, section, .review {
        overflow: hidden;
        border-right: 1px solid var(--line);
        background: var(--panel-2);
      }
      .review { border-right: 0; background: var(--panel); }
      .pane-title {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 12px 14px;
        border-bottom: 1px solid var(--line);
        color: var(--muted);
        font-weight: 650;
      }
      .file-list, .review-body, .search-results { overflow: auto; }
      .file-list { height: calc(100vh - 53px - 48px - 36px); }
      .review-body { height: calc(100vh - 53px - 48px); }
      .tree { padding: 6px 0; }
      .group-name {
        display: flex;
        align-items: center;
        gap: 7px;
        width: 100%;
        padding: 7px 14px 7px calc(14px + var(--depth, 0) * 1ch);
        border: 0;
        border-radius: 0;
        background: transparent;
        color: var(--muted);
        font-size: 12px;
        text-align: left;
      }
      .group-name:hover { color: var(--text); background: var(--active); }
      .group-name.ignored { color: var(--muted); opacity: .48; }
      .chevron {
        width: 9px;
        height: 9px;
        margin-left: 2px;
        border-right: 2px solid var(--blue);
        border-bottom: 2px solid var(--blue);
        transform: rotate(-45deg);
        transition: transform .12s ease;
      }
      .chevron.open { transform: rotate(45deg); }
      .file {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        align-items: center;
        gap: 8px;
        width: 100%;
        padding: 7px 14px 7px calc(14px + var(--depth, 0) * 1ch);
        border: 0;
        border-radius: 0;
        background: transparent;
        text-align: left;
      }
      .file.active { background: var(--active); }
      .file.ignored { color: var(--muted); opacity: .48; }
      .file-main {
        display: flex;
        align-items: center;
        gap: 8px;
        min-width: 0;
      }
      .file-path { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .mini-stat { color: var(--muted); font-size: 12px; }
      .status-dot {
        display: inline-flex;
        width: 7px;
        height: 7px;
        margin-left: auto;
        border-radius: 999px;
        background: currentColor;
      }
      .status { font-weight: 800; }
      .status.M { color: var(--yellow); }
      .status.A { color: var(--green); }
      .status.D { color: var(--red); }
      .status.U { color: var(--blue); }
      .status.I { color: var(--muted); }

      .content-head {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 10px 14px;
        border-bottom: 1px solid var(--line);
        background: var(--panel);
      }
      .file-tabs {
        display: flex;
        gap: 0;
        overflow-x: auto;
        overflow-y: hidden;
        flex: 1;
        min-width: 0;
        padding: 4px 14px;
        border-bottom: 1px solid var(--line);
        background: var(--panel-2);
      }
      .file-tab {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 6px 12px;
        border: 1px solid transparent;
        border-bottom: 0;
        border-radius: 6px 6px 0 0;
        background: transparent;
        color: var(--muted);
        font-size: 13px;
        white-space: nowrap;
        cursor: pointer;
        transition: all 0.1s;
      }
      .file-tab:hover { background: var(--button); color: var(--text); }
      .file-tab.active { background: var(--surface); border-color: var(--line); color: var(--text); }
      .file-tab-close {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 16px;
        height: 16px;
        border-radius: 3px;
        opacity: 0.6;
        transition: opacity 0.1s, background 0.1s;
      }
      .file-tab-close:hover { opacity: 1; background: var(--line); }
      .current-path { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
      .tabs { display: flex; gap: 6px; margin-left: auto; }
      .tabs button.active { border-color: var(--blue); color: var(--blue); }
      pre, textarea.editor {
        width: 100%;
        height: calc(100vh - 53px - 48px - 36px - 40px);
        margin: 0;
        padding: 16px;
        border: 0;
        background: var(--surface);
        color: var(--text);
        overflow: auto;
        font: 13px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        tab-size: 2;
      }
      textarea.editor {
        resize: none;
        outline: none;
        background: transparent;
        position: absolute;
        left: 0;
        top: 0;
        z-index: 2;
        color: transparent;
        caret-color: var(--text);
        white-space: pre;
      }
      textarea.editor.wrap-enabled {
        white-space: pre-wrap;
        word-wrap: break-word;
        overflow-y: auto;
        overflow-x: hidden;
      }
      textarea.editor.wrap-disabled {
        white-space: pre;
        word-wrap: normal;
        overflow: auto;
      }
      .editor-wrapper { position: relative; height: calc(100vh - 53px - 48px - 36px - 40px); overflow: hidden; background: var(--surface); }
      .editor-line-numbers {
        position: absolute;
        left: 0;
        top: 0;
        width: auto;
        min-width: 50px;
        height: 100%;
        padding: 16px 12px 16px 16px;
        margin-right: 12px;
        background: var(--panel-2);
        color: var(--muted);
        text-align: right;
        font: 13px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        overflow: hidden;
        user-select: none;
        border-right: 1px solid var(--line);
        z-index: 1;
        pointer-events: none;
        white-space: pre;
      }
      .editor-highlight {
        position: absolute;
        top: 0;
        height: 100%;
        padding: 16px;
        padding-left: 12px;
        margin: 0;
        border: 0;
        background: transparent;
        color: var(--text);
        overflow: auto;
        font: 13px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        pointer-events: none;
        z-index: 1;
        white-space: pre;
      }
      .editor-highlight.wrap-enabled {
        white-space: pre-wrap;
        word-wrap: break-word;
        overflow-y: auto;
        overflow-x: hidden;
      }
      .editor-highlight.wrap-disabled {
        white-space: pre;
        word-wrap: normal;
        overflow: auto;
      }
      .line-numbers {
        float: left;
        margin: 0 12px 0 0;
        padding-right: 12px;
        border-right: 1px solid var(--line);
        color: var(--muted);
        text-align: right;
        user-select: none;
      }
      .code-content { display: block; }
      .hljs { background: transparent !important; padding: 0 !important; }
      .diff-line { display: block; white-space: pre; }
      .diff-add { color: var(--diff-add-text); background: var(--diff-add-bg); }
      .diff-del { color: var(--diff-del-text); background: var(--diff-del-bg); }
      .diff-hunk { color: #79c0ff; }
      .empty {
        display: grid;
        place-items: center;
        height: calc(100vh - 53px - 48px - 36px - 40px);
        color: var(--muted);
      }
      .image-viewer {
        width: 100%;
        height: calc(100vh - 53px - 48px - 36px - 40px);
        overflow: hidden;
        background: var(--surface);
        position: relative;
        cursor: move;
      }
      .image-viewer img {
        position: absolute;
        max-width: none;
        user-select: none;
        image-rendering: auto;
      }
      .image-controls {
        position: absolute;
        top: 12px;
        right: 12px;
        display: flex;
        gap: 6px;
        z-index: 10;
      }
      .image-controls button {
        background: var(--panel);
        border: 1px solid var(--line);
        padding: 6px 10px;
        font-size: 12px;
      }
      .binary-notice {
        display: grid;
        place-items: center;
        height: calc(100vh - 53px - 48px - 36px);
        color: var(--muted);
        text-align: center;
        padding: 20px;
      }
      .binary-notice strong {
        color: var(--text);
        font-size: 16px;
        margin-bottom: 8px;
      }

      .review-body { padding: 14px; height: calc(100vh - 53px - 48px); }
      .card {
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 12px;
        margin-bottom: 12px;
        background: var(--surface);
        box-shadow: var(--shadow);
      }
      .card h3 { margin: 0 0 8px; font-size: 14px; }
      .card p { margin: 6px 0; color: var(--muted); }
      .search-results button {
        display: block;
        width: 100%;
        border: 0;
        border-radius: 0;
        padding: 8px 12px;
        background: transparent;
        text-align: left;
      }
      .search-results .where { color: var(--blue); font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; }
      .search-results .preview { color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .commit-list { padding: 6px 0; }
      .commit-item {
        display: block;
        width: 100%;
        border: 0;
        border-radius: 0;
        padding: 9px 14px;
        background: transparent;
        text-align: left;
      }
      .commit-item.active { background: var(--active); }
      .commit-subject { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 650; }
      .commit-meta { color: var(--muted); font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; }
      .commit-files-title { padding: 10px 14px 4px; color: var(--muted); font-size: 12px; font-weight: 650; }

      footer {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 9px 16px;
        border-top: 1px solid var(--line);
        background: var(--panel);
        color: var(--muted);
      }
      .message { color: var(--muted); }
      .message.error { color: var(--red); }
      .message.ok { color: var(--green); }

      @media (max-width: 900px) {
        html, body { overflow-x: hidden; }
        .app {
          width: 100%;
          max-width: 100vw;
          min-height: 100dvh;
          overflow-x: hidden;
        }
        header {
          flex-wrap: wrap;
          gap: 8px;
          padding: 10px;
          width: 100%;
          max-width: 100vw;
          min-width: 0;
        }
        .brand { width: 100%; min-width: 0; }
        .view-toggle { flex: 1 1 100%; }
        .view-toggle button { flex: 1; }
        .stat { min-width: 0; font-size: 12px; }
        .grow { display: none; }
        .search {
          order: 2;
          flex: 1 1 100%;
          min-width: 0;
          max-width: 100%;
        }

        main {
          display: block;
          width: 100%;
          max-width: 100vw;
          min-width: 0;
          min-height: auto;
        }
        aside, section, .review {
          width: 100%;
          min-width: 0;
          border-right: 0;
          border-bottom: 1px solid var(--line);
        }
        section { overflow: hidden; }
        .pane-title { padding: 10px 12px; }
        .file-list {
          height: 34dvh;
          min-height: 220px;
        }
        .group-name, .file, .commit-item { padding-right: 12px; padding-left: calc(12px + var(--depth, 0) * 1ch); }
        .content-head {
          flex-wrap: wrap;
          padding: 9px 12px;
        }
        .current-path { flex: 1 1 100%; }
        .tabs {
          width: 100%;
          margin-left: 0;
        }
        .tabs button { flex: 1; }
        pre, textarea.editor {
          max-width: 100%;
          height: 46dvh;
          min-height: 280px;
          padding: 12px;
          font-size: 12px;
        }
        .empty { height: 46dvh; min-height: 220px; }
        .review-body {
          height: auto;
          max-height: 34dvh;
          padding: 12px;
        }
        footer {
          flex-wrap: wrap;
          gap: 6px;
          padding: 8px 10px;
          font-size: 12px;
        }
        #root {
          min-width: 0;
          overflow: hidden;
          text-overflow: ellipsis;
          white-space: nowrap;
        }
      }

      @media (max-width: 520px) {
        body { font-size: 13px; }
        button { padding: 7px 9px; }
        header { gap: 7px; }
        .stat { flex: 1 1 calc(50% - 8px); }
        .search button { flex: 0 0 auto; }
        .file-list { height: 38dvh; }
        .mini-stat { display: none; }
        .commit-meta { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        pre, textarea.editor { height: 50dvh; }
        .review-body { max-height: 28dvh; }
      }
    </style>
  </head>
  <body>
    <div class="app">
      <header>
        <div class="brand">MindGit</div>
        <div class="view-toggle">
          <button id="worktree-view" class="active" type="button">Working Tree</button>
          <button id="history-view" type="button">History</button>
        </div>
        <div class="stat">Branch: <strong id="branch">-</strong></div>
        <div class="stat">Modified: <strong id="modified">0</strong></div>
        <div class="stat">Added: <strong id="added">0</strong></div>
        <div class="stat">Deleted: <strong id="deleted">0</strong></div>
        <div class="stat"><strong id="lines">+0 -0</strong></div>
        <button id="theme-toggle" type="button">Light</button>
        <button id="refresh" type="button">Refresh</button>
        <div class="grow"></div>
        <form class="search" id="search-form">
          <input id="search" placeholder="Search with rg" autocomplete="off" />
          <button type="submit">Search</button>
        </form>
      </header>

      <main>
        <aside>
          <div class="pane-title"><span id="change-title">Changes (0)</span></div>
          <div class="file-list" id="file-list"></div>
        </aside>

        <section>
          <div class="file-tabs" id="file-tabs"></div>
          <div class="content-head">
            <div class="current-path" id="current-path">Select a changed file</div>
            <div class="tabs">
              <button id="diff-tab" class="active" type="button">Diff</button>
              <button id="full-tab" type="button">Full</button>
              <button id="edit-tab" type="button">Edit</button>
            </div>
          </div>
          <div id="viewer"><div class="empty">No file selected</div></div>
        </section>

        <div class="review">
          <div class="pane-title"><span>Review</span></div>
          <div class="review-body">
            <div class="card">
              <h3>File Review</h3>
              <p id="review-summary">选择文件后，这里会显示变更摘要、风险提示和快速操作入口。</p>
            </div>
            <div class="card">
              <h3>Search Results</h3>
              <div class="search-results" id="search-results"><p>输入关键词后使用 rg 搜索。</p></div>
            </div>
          </div>
        </div>
      </main>

      <footer>
        <span id="root">-</span>
        <span class="message" id="message"></span>
      </footer>
    </div>

    <script>
      const state = {
        view: 'worktree',
        status: null,
        selected: null,
        mode: 'full',
        content: '',
        theme: localStorage.getItem('mindgit-theme') || 'dark',
        expandedGroups: new Set(),
        children: new Map(),
        history: [],
        selectedCommit: null,
        commitFiles: [],
        selectedCommitFile: null,
        wordWrap: localStorage.getItem('mindgit-wordwrap') === 'true',
        openTabs: [],
        tabStates: {}, // Store state for each tab: cursor, scroll, imageZoom, etc.
      };
      const $ = (id) => document.getElementById(id);

      applyTheme(state.theme);
      $('worktree-view').addEventListener('click', () => setView('worktree'));
      $('history-view').addEventListener('click', () => setView('history'));
      $('theme-toggle').addEventListener('click', toggleTheme);
      $('refresh').addEventListener('click', refresh);
      $('diff-tab').addEventListener('click', () => setMode('diff'));
      $('full-tab').addEventListener('click', () => setMode('full'));
      $('edit-tab').addEventListener('click', async () => {
        if (state.mode === 'edit' && $('edit-tab').textContent === 'Save') {
          await saveFile();
        } else {
          setMode('edit');
        }
      });
      $('file-list').addEventListener('click', handleTreeClick);
      $('search-form').addEventListener('submit', (event) => {
        event.preventDefault();
        search();
      });

      refresh();

      async function api(path, options) {
        const response = await fetch(path, options);
        const data = await response.json();
        if (!response.ok) throw new Error(data.error || response.statusText);
        return data;
      }

      async function setView(view) {
        if (state.view === view) return;
        state.view = view;
        state.selected = null;
        state.selectedCommitFile = null;
        state.mode = 'diff';
        state.openTabs = [];
        await refresh();
      }

      async function refresh() {
        try {
          setMessage('Refreshing...');
          $('worktree-view').classList.toggle('active', state.view === 'worktree');
          $('history-view').classList.toggle('active', state.view === 'history');
          if (state.view === 'history') {
            await loadHistory();
            renderHistory();
            setMessage('Updated', 'ok');
            return;
          }
          state.status = await api('/api/status');
          await refreshLoadedGroups();
          renderStatus();
          renderFileTabs();
          if (state.selected) {
            await renderSelected();
          } else {
            $('viewer').innerHTML = `<div class="empty">${state.status.files.length ? 'Expand a directory and select a changed file' : 'Working tree clean'}</div>`;
          }
          setMessage('Updated', 'ok');
        } catch (error) {
          setMessage(error.message, 'error');
        }
      }

      function renderStatus() {
        const status = state.status;
        $('root').textContent = status.root;
        $('branch').textContent = status.branch;
        $('modified').textContent = status.modified;
        $('added').textContent = status.added + status.untracked;
        $('deleted').textContent = status.deleted;
        $('lines').textContent = `+${status.additions} -${status.deletions}`;
        $('change-title').textContent = `Changes (${status.modified + status.added + status.deleted + status.untracked})`;

        $('file-list').innerHTML = renderEntries(status.files, 0);
      }

      async function loadHistory() {
        if (!state.status) {
          state.status = await api('/api/status');
        }
        const data = await api('/api/commits?limit=50');
        state.history = data.commits || [];
        if (!state.selectedCommit && state.history.length) {
          await selectCommit(state.history[0].hash, false);
        } else if (state.selectedCommit) {
          const detail = await api(`/api/commit?sha=${encodeURIComponent(state.selectedCommit.hash)}`);
          state.selectedCommit = detail.commit;
          state.commitFiles = detail.files || [];
        }
      }

      function renderHistory() {
        $('root').textContent = state.status ? state.status.root : '-';
        $('branch').textContent = state.status ? state.status.branch : '-';
        $('modified').textContent = '0';
        $('added').textContent = '0';
        $('deleted').textContent = '0';
        $('lines').textContent = state.selectedCommit ? state.selectedCommit.shortHash : '+0 -0';
        $('change-title').textContent = `History (${state.history.length})`;
        $('file-list').innerHTML = `
          <div class="commit-list">
            ${state.history.map(renderCommit).join('') || '<div class="empty">No commits</div>'}
          </div>
          ${state.selectedCommit ? renderCommitFiles() : ''}`;
        $('review-summary').textContent = state.selectedCommit
          ? `${state.selectedCommit.shortHash}: ${state.selectedCommit.subject}`
          : '选择提交后，这里会显示提交摘要。';
        if (!state.selectedCommitFile) {
          $('current-path').textContent = state.selectedCommit ? `${state.selectedCommit.shortHash} files` : 'Select a commit';
          $('viewer').innerHTML = `<div class="empty">${state.selectedCommit ? 'Select a file from this commit' : 'No commit selected'}</div>`;
        }
        $('diff-tab').classList.add('active');
        $('full-tab').classList.remove('active');
        $('edit-tab').classList.remove('active');
        if ($('edit-tab').textContent === 'Save') {
          $('edit-tab').textContent = 'Edit';
          $('edit-tab').classList.remove('primary');
        }
      }

      function renderCommit(commit) {
        return `
          <button class="commit-item ${state.selectedCommit && commit.hash === state.selectedCommit.hash ? 'active' : ''}" type="button" data-commit="${escapeAttr(commit.hash)}">
            <div class="commit-subject">${escapeHTML(commit.subject)}</div>
            <div class="commit-meta">${escapeHTML(commit.shortHash)} · ${escapeHTML(commit.author)} · ${escapeHTML(formatDate(commit.date))}</div>
          </button>`;
      }

      function renderCommitFiles() {
        return `
          <div class="commit-files-title">Changed files (${state.commitFiles.length})</div>
          <div class="tree">
            ${state.commitFiles.map((file) => renderCommitFile(file)).join('') || '<div class="empty">No files</div>'}
          </div>`;
      }

      function renderCommitFile(file) {
        return `
          <button class="file ${file.path === state.selectedCommitFile ? 'active' : ''}" title="${escapeHTML(file.path)}" data-commit-path="${escapeAttr(file.path)}" style="--depth: 0">
            <span class="file-main">
              <span class="status ${file.status}">${file.status}</span>
              <span class="file-path">${escapeHTML(file.path)}</span>
            </span>
            <span class="mini-stat">+${file.additions} -${file.deletions}</span>
          </button>`;
      }

      async function refreshLoadedGroups() {
        const groups = [...state.expandedGroups].filter(Boolean);
        const refreshed = await Promise.all(groups.map(async (group) => {
          const data = await api(`/api/tree?path=${encodeURIComponent(group)}`);
          return [group, data.files];
        }));
        for (const [group, files] of refreshed) {
          state.children.set(group, files);
        }
      }

      function renderEntries(entries, depth) {
        return `<div class="tree">${entries.map((entry) => entry.isDir ? renderDirectory(entry, depth) : renderFile(entry, depth)).join('')}</div>`;
      }

      function renderDirectory(dir, depth) {
        const expanded = state.expandedGroups.has(dir.path);
        const children = state.children.get(dir.path) || [];
        return `
          <div>
            <button class="group-name ${dir.ignored ? 'ignored' : ''}" type="button" data-group="${escapeAttr(dir.path)}" style="--depth: ${depth}">
              <span class="chevron ${expanded ? 'open' : ''}"></span>
              <span>${escapeHTML(displayName(dir.path))}</span>
              ${isTreeChange(dir) ? `<span class="status ${dir.status}"><span class="status-dot"></span></span>` : ''}
            </button>
            ${expanded ? renderEntries(children, depth + 1) : ''}
          </div>`;
      }

      function renderFile(file, depth) {
        return `
          <button class="file ${file.path === state.selected ? 'active' : ''} ${file.ignored ? 'ignored' : ''}" title="${escapeHTML(file.path)}" data-path="${escapeAttr(file.path)}" style="--depth: ${depth}">
            <span class="file-main">
              ${isChanged(file) ? `<span class="status ${file.status}">${file.status}</span>` : ''}
              <span class="file-path">${escapeHTML(displayName(file.path))}</span>
            </span>
            <span class="mini-stat">${isChanged(file) ? `+${file.additions} -${file.deletions}` : ''}</span>
          </button>`;
      }

      function displayName(path) {
        return path.includes('/') ? path.split('/').pop() : path;
      }

      function isChanged(file) {
        return Boolean(file.status) && file.status !== 'I' && !file.ignored;
      }

      function isTreeChange(entry) {
        return Boolean(entry.status) && entry.status !== 'I';
      }

      async function handleTreeClick(event) {
        if (state.view === 'history') {
          const commit = event.target.closest('[data-commit]');
          if (commit) {
            await selectCommit(commit.dataset.commit);
            return;
          }
          const file = event.target.closest('[data-commit-path]');
          if (file) {
            await selectCommitFile(file.dataset.commitPath);
          }
          return;
        }
        const group = event.target.closest('[data-group]');
        if (group) {
          const dir = group.dataset.group;
          if (state.expandedGroups.has(dir)) {
            state.expandedGroups.delete(dir);
          } else {
            if (!state.children.has(dir)) {
              const data = await api(`/api/tree?path=${encodeURIComponent(dir)}`);
              state.children.set(dir, data.files);
            }
            state.expandedGroups.add(dir);
          }
          renderStatus();
          return;
        }
        const file = event.target.closest('[data-path]');
        if (file) {
          selectFile(file.dataset.path);
        }
      }

      async function selectCommit(sha, shouldRender = true) {
        const detail = await api(`/api/commit?sha=${encodeURIComponent(sha)}`);
        state.selectedCommit = detail.commit;
        state.commitFiles = detail.files || [];
        state.selectedCommitFile = null;
        if (shouldRender) {
          renderHistory();
        }
      }

      async function selectCommitFile(path) {
        if (!state.selectedCommit) return;
        state.selectedCommitFile = path;
        $('current-path').textContent = `${state.selectedCommit.shortHash} · ${path}`;
        const data = await api(`/api/commit-diff?sha=${encodeURIComponent(state.selectedCommit.hash)}&path=${encodeURIComponent(path)}`);
        $('viewer').innerHTML = `<pre>${renderDiff(data.diff || 'No diff for this file.')}</pre>`;
        renderHistory();
      }

      function renderFileTabs() {
        const tabsContainer = $('file-tabs');
        if (!tabsContainer) return;

        if (state.openTabs.length === 0) {
          tabsContainer.innerHTML = '';
          tabsContainer.style.display = 'none';
          return;
        }

        tabsContainer.style.display = 'flex';
        tabsContainer.innerHTML = state.openTabs.map(path => {
          const fileName = path.includes('/') ? path.split('/').pop() : path;
          const isActive = path === state.selected;
          return `
            <button class="file-tab ${isActive ? 'active' : ''}" data-tab-path="${escapeAttr(path)}" title="${escapeHTML(path)}">
              <span>${escapeHTML(fileName)}</span>
              <span class="file-tab-close" data-close-tab="${escapeAttr(path)}">×</span>
            </button>`;
        }).join('');

        // Add event listeners
        document.querySelectorAll('[data-tab-path]').forEach(tab => {
          tab.addEventListener('click', (e) => {
            if (!e.target.closest('.file-tab-close')) {
              selectFile(tab.dataset.tabPath);
            }
          });
        });

        document.querySelectorAll('[data-close-tab]').forEach(closeBtn => {
          closeBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            closeTab(closeBtn.dataset.closeTab);
          });
        });
      }

      function closeTab(path) {
        const index = state.openTabs.indexOf(path);
        if (index === -1) return;

        state.openTabs.splice(index, 1);
        // Clean up saved state for this tab
        delete state.tabStates[path];

        // If closing active tab, switch to another tab
        if (path === state.selected) {
          if (state.openTabs.length > 0) {
            // Switch to previous tab, or next if it was the first
            const newIndex = index > 0 ? index - 1 : 0;
            selectFile(state.openTabs[newIndex]);
          } else {
            // No tabs left, clear selection
            state.selected = null;
            state.mode = 'full';
            $('viewer').innerHTML = '<div class="empty">No file selected</div>';
            $('current-path').textContent = 'Select a changed file';
            renderFileTabs();
          }
        } else {
          renderFileTabs();
        }
      }

      function saveCurrentTabState() {
        if (!state.selected) return;

        const editor = $('editor');
        const viewer = $('viewer');

        state.tabStates[state.selected] = {
          mode: state.mode,
          scrollTop: viewer ? viewer.scrollTop : 0,
          scrollLeft: viewer ? viewer.scrollLeft : 0,
        };

        // Save editor-specific state
        if (editor && state.mode === 'edit') {
          state.tabStates[state.selected].cursorStart = editor.selectionStart;
          state.tabStates[state.selected].cursorEnd = editor.selectionEnd;
          state.tabStates[state.selected].editorScrollTop = editor.scrollTop;
          state.tabStates[state.selected].editorScrollLeft = editor.scrollLeft;
        }

        // Save image viewer state
        const imageViewer = viewer?.querySelector('.image-viewer');
        if (imageViewer) {
          const img = imageViewer.querySelector('img');
          if (img) {
            state.tabStates[state.selected].imageZoom = parseFloat(img.style.width) || 100;
            state.tabStates[state.selected].imageLeft = parseFloat(img.style.left) || 0;
            state.tabStates[state.selected].imageTop = parseFloat(img.style.top) || 0;
          }
        }
      }

      function restoreTabState(path) {
        if (!state.tabStates[path]) return;

        const savedState = state.tabStates[path];

        // Restore mode if saved
        if (savedState.mode) {
          state.mode = savedState.mode;
        }

        // Restore scroll and cursor after render
        setTimeout(() => {
          const editor = $('editor');
          const viewer = $('viewer');

          // Restore editor state
          if (editor && savedState.cursorStart !== undefined) {
            editor.setSelectionRange(savedState.cursorStart, savedState.cursorEnd);
            if (savedState.editorScrollTop !== undefined) {
              editor.scrollTop = savedState.editorScrollTop;
              editor.scrollLeft = savedState.editorScrollLeft;
            }
            editor.focus();
          }

          // Restore viewer scroll
          if (viewer && savedState.scrollTop !== undefined) {
            viewer.scrollTop = savedState.scrollTop;
            viewer.scrollLeft = savedState.scrollLeft;
          }

          // Restore image viewer state
          const imageViewer = viewer?.querySelector('.image-viewer');
          if (imageViewer && savedState.imageZoom !== undefined) {
            const img = imageViewer.querySelector('img');
            if (img) {
              img.style.width = savedState.imageZoom + '%';
              img.style.left = savedState.imageLeft + 'px';
              img.style.top = savedState.imageTop + 'px';
            }
          }
        }, 50);
      }

      async function selectFile(path) {
        // Save current tab state before switching
        saveCurrentTabState();

        // Add to tabs if not already open
        if (!state.openTabs.includes(path)) {
          state.openTabs.push(path);
        }

        state.selected = path;
        state.mode = 'full';
        state.expandedGroups.add(groupForPath(path));
        renderStatus();
        renderFileTabs();
        await renderSelected();
        restoreTabState(path);
      }

      function groupForPath(path) {
        return path.includes('/') ? path.split('/').slice(0, -1).join('/') : '';
      }

      function toggleTheme() {
        applyTheme(state.theme === 'dark' ? 'light' : 'dark');
      }

      function applyTheme(theme) {
        state.theme = theme;
        document.documentElement.dataset.theme = theme;
        localStorage.setItem('mindgit-theme', theme);
        $('theme-toggle').textContent = theme === 'dark' ? 'Light' : 'Dark';
        const darkStyle = $('hljs-dark');
        const lightStyle = $('hljs-light');
        if (theme === 'dark') {
          if (darkStyle) darkStyle.disabled = false;
          if (lightStyle) lightStyle.disabled = true;
        } else {
          if (darkStyle) darkStyle.disabled = true;
          if (lightStyle) lightStyle.disabled = false;
        }
      }

      async function setMode(mode) {
        if (state.view === 'history') return;
        if (!state.selected) return;
        if (state.mode === 'edit' && mode !== 'edit') {
          await saveFile();
        }
        saveCurrentTabState();
        state.mode = mode;
        await renderSelected();
        restoreTabState(state.selected);
      }

      async function renderSelected() {
        if (!state.selected) return;
        $('current-path').textContent = state.selected;
        $('diff-tab').classList.toggle('active', state.mode === 'diff');
        $('full-tab').classList.toggle('active', state.mode === 'full');
        $('edit-tab').classList.toggle('active', state.mode === 'edit');

        const file = state.status.files.find((item) => item.path === state.selected);
        $('review-summary').textContent = file
          ? `${file.path}: ${file.status}，新增 ${file.additions} 行，删除 ${file.deletions} 行。`
          : state.selected;

        // Check if file is binary or image
        const isBinary = isLikelyBinary(state.selected);
        const isImage = isImageFile(state.selected);

        if (state.mode === 'edit') {
          if (isBinary) {
            $('viewer').innerHTML = `<div class="binary-notice"><div><strong>Cannot Edit Binary File</strong><p>This file type cannot be edited in the browser.</p></div></div>`;
            $('edit-tab').textContent = 'Edit';
            $('edit-tab').classList.remove('primary');
            return;
          }

          if ($('edit-tab').textContent !== 'Save') {
            $('edit-tab').textContent = 'Save';
            $('edit-tab').classList.add('primary');
          }
          const data = await api(`/api/file?path=${encodeURIComponent(state.selected)}`);
          state.content = data.content;
          const lines = data.content.split('\n').length;
          const lineNumbers = Array.from({length: lines}, (_, i) => i + 1).join('\n');

          // Get syntax highlighting
          const ext = state.selected.split('.').pop().toLowerCase();
          const langMap = {
            js: 'javascript', ts: 'typescript', jsx: 'javascript', tsx: 'typescript',
            py: 'python', rb: 'ruby', go: 'go', rs: 'rust', java: 'java', c: 'c', cpp: 'cpp',
            cs: 'csharp', php: 'php', swift: 'swift', kt: 'kotlin', scala: 'scala',
            html: 'html', css: 'css', scss: 'scss', sass: 'sass', less: 'less',
            xml: 'xml', json: 'json', yaml: 'yaml', yml: 'yaml', toml: 'toml',
            md: 'markdown', sql: 'sql', sh: 'bash', bash: 'bash', zsh: 'bash',
          };
          const language = langMap[ext] || 'plaintext';

          $('viewer').innerHTML = `<div class="editor-wrapper">
            <div class="editor-line-numbers" id="editor-line-numbers">${escapeHTML(lineNumbers)}</div>
            <pre class="editor-highlight ${state.wordWrap ? 'wrap-enabled' : 'wrap-disabled'}" id="editor-highlight" aria-hidden="true"></pre>
            <textarea class="editor ${state.wordWrap ? 'wrap-enabled' : 'wrap-disabled'}" id="editor" spellcheck="false"></textarea>
          </div>`;

          const editor = $('editor');
          const highlight = $('editor-highlight');
          const lineNumbersEl = $('editor-line-numbers');
          editor.value = data.content;

          // Calculate line number width and adjust padding
          setTimeout(() => {
            const lineNumberWidth = lineNumbersEl.offsetWidth;
            editor.style.paddingLeft = `${lineNumberWidth + 12}px`;
            highlight.style.left = `${lineNumberWidth}px`;
            highlight.style.width = `calc(100% - ${lineNumberWidth}px)`;
          }, 0);

          editor.focus();
          setupEditorShortcuts(editor);

          // Trigger initial update
          editor.dispatchEvent(new Event('input'));
        } else {
          if ($('edit-tab').textContent === 'Save') {
            $('edit-tab').textContent = 'Edit';
            $('edit-tab').classList.remove('primary');
          }
          if (state.mode === 'full') {
            if (isImage) {
              renderImageViewer(state.selected);
            } else if (isBinary) {
              $('viewer').innerHTML = `<div class="binary-notice"><div><strong>Binary File</strong><p>This file cannot be displayed as text.</p></div></div>`;
            } else {
              const data = await api(`/api/file?path=${encodeURIComponent(state.selected)}`);
              renderFullContent(data.content, state.selected);
            }
          } else {
            const data = await api(`/api/diff?path=${encodeURIComponent(state.selected)}`);
            $('viewer').innerHTML = `<pre>${renderDiff(data.diff || 'No diff for this file.')}</pre>`;
          }
        }
      }

      function isImageFile(path) {
        const ext = path.split('.').pop().toLowerCase();
        return ['png', 'jpg', 'jpeg', 'gif', 'bmp', 'webp', 'svg', 'ico'].includes(ext);
      }

      function isLikelyBinary(path) {
        const ext = path.split('.').pop().toLowerCase();
        const binaryExts = [
          'png', 'jpg', 'jpeg', 'gif', 'bmp', 'webp', 'ico', 'svg',
          'zip', 'tar', 'gz', 'rar', '7z', 'bz2', 'xz',
          'pdf', 'doc', 'docx', 'xls', 'xlsx', 'ppt', 'pptx',
          'exe', 'dll', 'so', 'dylib', 'bin',
          'wasm', 'pyc', 'class', 'jar',
          'mp3', 'mp4', 'avi', 'mov', 'mkv', 'wav', 'flac',
          'ttf', 'otf', 'woff', 'woff2', 'eot',
        ];
        return binaryExts.includes(ext);
      }

      function renderImageViewer(imagePath) {
        const imageUrl = `/api/file?path=${encodeURIComponent(imagePath)}`;
        $('viewer').innerHTML = `
          <div class="image-viewer" id="image-viewer">
            <div class="image-controls">
              <button id="zoom-in" type="button">Zoom In</button>
              <button id="zoom-out" type="button">Zoom Out</button>
              <button id="zoom-reset" type="button">Reset</button>
            </div>
            <img id="viewer-image" src="${imageUrl}" alt="${escapeHTML(imagePath)}">
          </div>`;

        const viewer = $('image-viewer');
        const img = $('viewer-image');
        let scale = 1;
        let translateX = 0;
        let translateY = 0;
        let isDragging = false;
        let startX = 0;
        let startY = 0;

        // Center image on load
        img.addEventListener('load', () => {
          const containerWidth = viewer.clientWidth;
          const containerHeight = viewer.clientHeight;
          const imgWidth = img.naturalWidth;
          const imgHeight = img.naturalHeight;

          // Calculate initial scale to fit image in viewport
          const scaleX = containerWidth / imgWidth;
          const scaleY = containerHeight / imgHeight;
          scale = Math.min(scaleX, scaleY, 1); // Don't scale up initially

          // Center the image
          translateX = (containerWidth - imgWidth * scale) / 2;
          translateY = (containerHeight - imgHeight * scale) / 2;
          updateImageTransform();
        });

        function updateImageTransform() {
          img.style.transform = `translate(${translateX}px, ${translateY}px) scale(${scale})`;
          img.style.transformOrigin = '0 0';
        }

        // Zoom controls
        $('zoom-in').addEventListener('click', () => {
          const oldScale = scale;
          scale *= 1.2;
          // Zoom towards center
          const centerX = viewer.clientWidth / 2;
          const centerY = viewer.clientHeight / 2;
          translateX = centerX - (centerX - translateX) * (scale / oldScale);
          translateY = centerY - (centerY - translateY) * (scale / oldScale);
          updateImageTransform();
        });

        $('zoom-out').addEventListener('click', () => {
          const oldScale = scale;
          scale /= 1.2;
          if (scale < 0.1) scale = 0.1;
          // Zoom towards center
          const centerX = viewer.clientWidth / 2;
          const centerY = viewer.clientHeight / 2;
          translateX = centerX - (centerX - translateX) * (scale / oldScale);
          translateY = centerY - (centerY - translateY) * (scale / oldScale);
          updateImageTransform();
        });

        $('zoom-reset').addEventListener('click', () => {
          const containerWidth = viewer.clientWidth;
          const containerHeight = viewer.clientHeight;
          const imgWidth = img.naturalWidth;
          const imgHeight = img.naturalHeight;
          const scaleX = containerWidth / imgWidth;
          const scaleY = containerHeight / imgHeight;
          scale = Math.min(scaleX, scaleY, 1);
          translateX = (containerWidth - imgWidth * scale) / 2;
          translateY = (containerHeight - imgHeight * scale) / 2;
          updateImageTransform();
        });

        // Mouse wheel zoom
        viewer.addEventListener('wheel', (e) => {
          e.preventDefault();
          const oldScale = scale;
          const delta = e.deltaY > 0 ? 0.9 : 1.1;
          scale *= delta;
          if (scale < 0.1) scale = 0.1;
          if (scale > 10) scale = 10;

          // Zoom towards mouse position
          const rect = viewer.getBoundingClientRect();
          const mouseX = e.clientX - rect.left;
          const mouseY = e.clientY - rect.top;
          translateX = mouseX - (mouseX - translateX) * (scale / oldScale);
          translateY = mouseY - (mouseY - translateY) * (scale / oldScale);
          updateImageTransform();
        });

        // Drag to pan - use document-level events to prevent losing drag
        const handleMouseDown = (e) => {
          if (e.target === img || e.target === viewer) {
            e.preventDefault();
            isDragging = true;
            startX = e.clientX - translateX;
            startY = e.clientY - translateY;
            viewer.style.cursor = 'grabbing';
          }
        };

        const handleMouseMove = (e) => {
          if (isDragging) {
            e.preventDefault();
            translateX = e.clientX - startX;
            translateY = e.clientY - startY;
            updateImageTransform();
          }
        };

        const handleMouseUp = () => {
          if (isDragging) {
            isDragging = false;
            viewer.style.cursor = 'move';
          }
        };

        viewer.addEventListener('mousedown', handleMouseDown);
        document.addEventListener('mousemove', handleMouseMove);
        document.addEventListener('mouseup', handleMouseUp);

        // Cleanup on viewer change
        viewer.dataset.cleanup = () => {
          document.removeEventListener('mousemove', handleMouseMove);
          document.removeEventListener('mouseup', handleMouseUp);
        };
      }

      async function saveFile() {
        if (!state.selected) return;
        try {
          setMessage('Saving...');
          const editor = $('editor');
          const content = editor ? editor.value : state.content;

          // Save cursor position
          const cursorStart = editor ? editor.selectionStart : 0;
          const cursorEnd = editor ? editor.selectionEnd : 0;

          console.log('Saving file:', state.selected, 'Content length:', content.length);
          await api('/api/file', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ path: state.selected, content }),
          });

          // Only refresh status, don't re-render editor
          state.status = await api('/api/status');
          await refreshLoadedGroups();
          renderStatus();

          // Restore cursor position
          if (editor) {
            editor.focus();
            editor.setSelectionRange(cursorStart, cursorEnd);
          }

          setMessage('Saved', 'ok');
        } catch (error) {
          console.error('Save error:', error);
          setMessage(error.message, 'error');
        }
      }

      function renderFullContent(content, filename) {
        const lines = content.split('\n');
        const lineNumbers = lines.map((_, i) => i + 1).join('\n');
        const ext = filename.split('.').pop().toLowerCase();
        const langMap = {
          js: 'javascript', ts: 'typescript', jsx: 'javascript', tsx: 'typescript',
          py: 'python', rb: 'ruby', go: 'go', rs: 'rust', java: 'java', c: 'c', cpp: 'cpp',
          cs: 'csharp', php: 'php', swift: 'swift', kt: 'kotlin', scala: 'scala',
          html: 'html', css: 'css', scss: 'scss', sass: 'sass', less: 'less',
          xml: 'xml', json: 'json', yaml: 'yaml', yml: 'yaml', toml: 'toml',
          md: 'markdown', sql: 'sql', sh: 'bash', bash: 'bash', zsh: 'bash',
        };
        const language = langMap[ext] || 'plaintext';
        let highlighted = content;

        if (language !== 'plaintext' && typeof hljs !== 'undefined') {
          try {
            highlighted = hljs.highlight(content, { language, ignoreIllegals: true }).value;
          } catch (e) {
            console.error('Highlight error:', e);
            highlighted = escapeHTML(content);
          }
        } else {
          highlighted = escapeHTML(content);
        }

        $('viewer').innerHTML = `<pre><code class="line-numbers">${escapeHTML(lineNumbers)}</code><code class="code-content">${highlighted}</code></pre>`;
      }

      function setupEditorShortcuts(editor) {
        const lineNumbersEl = $('editor-line-numbers');
        const highlightEl = $('editor-highlight');

        // Undo/Redo stack with cursor positions
        let undoStack = [{ value: editor.value, cursor: 0 }];
        let redoStack = [];
        let lastValue = editor.value;
        let isUndoRedo = false;

        // Update line numbers and highlight on content change
        const updateEditor = () => {
          const content = editor.value;
          const lines = content.split('\n').length;
          const lineNumbers = Array.from({length: lines}, (_, i) => i + 1).join('\n');
          if (lineNumbersEl) {
            lineNumbersEl.textContent = lineNumbers;

            // Recalculate width if line number digits changed
            const lineNumberWidth = lineNumbersEl.offsetWidth;
            editor.style.paddingLeft = `${lineNumberWidth + 12}px`;
            if (highlightEl) {
              highlightEl.style.left = `${lineNumberWidth}px`;
              highlightEl.style.width = `calc(100% - ${lineNumberWidth}px)`;
            }
          }

          // Update highlight
          if (highlightEl) {
            const ext = state.selected.split('.').pop().toLowerCase();
            const langMap = {
              js: 'javascript', ts: 'typescript', jsx: 'javascript', tsx: 'typescript',
              py: 'python', rb: 'ruby', go: 'go', rs: 'rust', java: 'java', c: 'c', cpp: 'cpp',
              cs: 'csharp', php: 'php', swift: 'swift', kt: 'kotlin', scala: 'scala',
              html: 'html', css: 'css', scss: 'scss', sass: 'sass', less: 'less',
              xml: 'xml', json: 'json', yaml: 'yaml', yml: 'yaml', toml: 'toml',
              md: 'markdown', sql: 'sql', sh: 'bash', bash: 'bash', zsh: 'bash',
            };
            const language = langMap[ext] || 'plaintext';
            let highlighted = content;
            if (language !== 'plaintext' && typeof hljs !== 'undefined') {
              try {
                highlighted = hljs.highlight(content, { language, ignoreIllegals: true }).value;
              } catch (e) {
                highlighted = escapeHTML(content);
              }
            } else {
              highlighted = escapeHTML(content);
            }
            highlightEl.innerHTML = highlighted;
          }
        };

        // Sync scroll between editor and line numbers/highlight
        editor.addEventListener('scroll', () => {
          if (lineNumbersEl) lineNumbersEl.scrollTop = editor.scrollTop;
          if (highlightEl) {
            highlightEl.scrollTop = editor.scrollTop;
            highlightEl.scrollLeft = editor.scrollLeft;
          }
        });

        editor.addEventListener('input', () => {
          updateEditor();

          // Save to undo stack if not from undo/redo
          if (!isUndoRedo && editor.value !== lastValue) {
            undoStack.push({
              value: editor.value,
              cursor: editor.selectionStart
            });
            if (undoStack.length > 100) undoStack.shift(); // Limit stack size
            redoStack = []; // Clear redo stack on new input
            lastValue = editor.value;
          }
          isUndoRedo = false;
        });

        // Column selection state
        let columnSelectStart = null;

        editor.addEventListener('keydown', (e) => {
          // Ctrl+Z for undo - handle first to prevent conflicts
          if (e.ctrlKey && !e.altKey && (e.key === 'z' || e.key === 'Z') && !e.shiftKey) {
            e.preventDefault();
            if (undoStack.length > 1) {
              redoStack.push(undoStack.pop());
              const prevState = undoStack[undoStack.length - 1];
              isUndoRedo = true;
              editor.value = prevState.value;
              lastValue = prevState.value;
              updateEditor();
              // Restore cursor position
              editor.setSelectionRange(prevState.cursor, prevState.cursor);
              setMessage('Undo', 'ok');
            }
            return;
          }

          // Ctrl+Shift+Z or Ctrl+Y for redo - handle early
          if (e.ctrlKey && !e.altKey && ((e.shiftKey && (e.key === 'z' || e.key === 'Z')) || e.key === 'y')) {
            e.preventDefault();
            if (redoStack.length > 0) {
              const nextState = redoStack.pop();
              undoStack.push(nextState);
              isUndoRedo = true;
              editor.value = nextState.value;
              lastValue = nextState.value;
              updateEditor();
              // Restore cursor position
              editor.setSelectionRange(nextState.cursor, nextState.cursor);
              setMessage('Redo', 'ok');
            }
            return;
          }

          // Alt+Z toggle word wrap
          if (e.altKey && !e.ctrlKey && (e.key === 'z' || e.key === 'Z')) {
            e.preventDefault();
            state.wordWrap = !state.wordWrap;
            localStorage.setItem('mindgit-wordwrap', state.wordWrap);

            const wrapClass = state.wordWrap ? 'wrap-enabled' : 'wrap-disabled';
            const removeClass = state.wordWrap ? 'wrap-disabled' : 'wrap-enabled';

            editor.classList.remove(removeClass);
            editor.classList.add(wrapClass);
            if (highlightEl) {
              highlightEl.classList.remove(removeClass);
              highlightEl.classList.add(wrapClass);
            }

            setMessage(state.wordWrap ? 'Word wrap enabled' : 'Word wrap disabled', 'ok');
            return;
          }

          // Start column selection mode with Shift+Alt
          if (e.shiftKey && e.altKey && ['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown'].includes(e.key)) {
            e.preventDefault();
            if (!columnSelectStart) {
              columnSelectStart = getCursorPosition(editor);
            }
            handleColumnSelection(editor, columnSelectStart, e.key);
            return;
          }

          // Exit column selection mode
          if (!e.shiftKey || !e.altKey) {
            columnSelectStart = null;
          }

          if (e.ctrlKey && e.key === 's') {
            e.preventDefault();
            saveFile();
          } else if (e.ctrlKey && e.key === 'Enter') {
            e.preventDefault();
            const pos = editor.selectionStart;
            const val = editor.value;
            editor.value = val.substring(0, pos) + '\n' + val.substring(pos);
            editor.selectionStart = editor.selectionEnd = pos + 1;
            updateEditor();
          } else if (e.ctrlKey && e.key === 'f') {
            e.preventDefault();
            showFindReplace(editor);
          } else if (e.ctrlKey && e.key === 'g') {
            e.preventDefault();
            showGotoLine(editor);
          } else if (e.ctrlKey && e.key === 'x') {
            // Only intercept if no text is selected
            if (editor.selectionStart === editor.selectionEnd) {
              e.preventDefault();
              cutLine(editor);
              updateEditor();
            }
          } else if (e.ctrlKey && e.key === 'c') {
            // Only intercept if no text is selected
            if (editor.selectionStart === editor.selectionEnd) {
              e.preventDefault();
              copyLine(editor);
            }
          }
        });
      }

      function getCursorPosition(editor) {
        const text = editor.value;
        const pos = editor.selectionStart;
        const lines = text.substring(0, pos).split('\n');
        const row = lines.length - 1;
        const col = lines[lines.length - 1].length;
        return { row, col, pos };
      }

      function getPositionFromRowCol(editor, row, col) {
        const lines = editor.value.split('\n');
        if (row < 0) row = 0;
        if (row >= lines.length) row = lines.length - 1;
        const line = lines[row];
        if (col > line.length) col = line.length;
        let pos = 0;
        for (let i = 0; i < row; i++) {
          pos += lines[i].length + 1; // +1 for newline
        }
        pos += col;
        return pos;
      }

      function handleColumnSelection(editor, start, key) {
        const current = getCursorPosition(editor);
        let targetRow = current.row;
        let targetCol = current.col;

        switch (key) {
          case 'ArrowLeft':
            targetCol = Math.max(0, current.col - 1);
            break;
          case 'ArrowRight':
            targetCol = current.col + 1;
            break;
          case 'ArrowUp':
            targetRow = Math.max(0, current.row - 1);
            break;
          case 'ArrowDown':
            targetRow = current.row + 1;
            break;
        }

        // Perform rectangular selection
        const lines = editor.value.split('\n');
        const minRow = Math.min(start.row, targetRow);
        const maxRow = Math.max(start.row, targetRow);
        const minCol = Math.min(start.col, targetCol);
        const maxCol = Math.max(start.col, targetCol);

        // Build the rectangular selection by taking slices from each line
        let selectedText = [];
        for (let r = minRow; r <= maxRow && r < lines.length; r++) {
          const line = lines[r];
          const startCol = Math.min(minCol, line.length);
          const endCol = Math.min(maxCol, line.length);
          selectedText.push(line.substring(startCol, endCol));
        }

        // Set selection range - standard textarea doesn't support true rectangular selection
        // but we can approximate by selecting from start to end position
        const selStart = getPositionFromRowCol(editor, minRow, minCol);
        const selEnd = getPositionFromRowCol(editor, targetRow, targetCol);

        if (selStart <= selEnd) {
          editor.selectionStart = selStart;
          editor.selectionEnd = selEnd;
        } else {
          editor.selectionStart = selEnd;
          editor.selectionEnd = selStart;
        }
      }

      function getCurrentLine(editor) {
        const pos = editor.selectionStart;
        const text = editor.value;
        const lines = text.split('\n');

        // Find which line the cursor is on
        let currentPos = 0;
        let lineIndex = 0;
        for (let i = 0; i < lines.length; i++) {
          const lineLength = lines[i].length + 1; // +1 for newline
          if (currentPos + lineLength > pos || i === lines.length - 1) {
            lineIndex = i;
            break;
          }
          currentPos += lineLength;
        }

        const line = lines[lineIndex] || '';
        return { lineIndex, line, lines, lineStartPos: currentPos };
      }

      function cutLine(editor) {
        const { lineIndex, line, lines, lineStartPos } = getCurrentLine(editor);
        navigator.clipboard.writeText(line + '\n').then(() => {
          lines.splice(lineIndex, 1);
          editor.value = lines.join('\n');

          // Trigger input event to update highlight
          editor.dispatchEvent(new Event('input'));

          // Position cursor at start of current line (or previous line if we deleted last)
          const newLineIndex = Math.min(lineIndex, lines.length - 1);
          let pos = 0;
          for (let i = 0; i < newLineIndex; i++) {
            pos += lines[i].length + 1;
          }
          editor.selectionStart = editor.selectionEnd = pos;
        }).catch(err => console.error('Failed to cut line:', err));
      }

      function copyLine(editor) {
        const { line } = getCurrentLine(editor);
        navigator.clipboard.writeText(line + '\n').then(() => {
          // Success
        }).catch(err => console.error('Failed to copy line:', err));
      }

      function showFindReplace(editor) {
        const query = prompt('Find:');
        if (!query) return;
        const replace = prompt('Replace with (leave empty to skip replace):');
        if (replace !== null && replace !== '') {
          editor.value = editor.value.replaceAll(query, replace);
        } else {
          const index = editor.value.indexOf(query);
          if (index !== -1) {
            editor.focus();
            editor.selectionStart = index;
            editor.selectionEnd = index + query.length;
          } else {
            alert('Not found');
          }
        }
      }

      function showGotoLine(editor) {
        const line = prompt('Go to line:');
        if (!line) return;
        const lineNum = parseInt(line, 10);
        if (isNaN(lineNum)) return;
        const lines = editor.value.split('\n');
        if (lineNum < 1 || lineNum > lines.length) {
          alert(`Line must be between 1 and ${lines.length}`);
          return;
        }
        const pos = lines.slice(0, lineNum - 1).join('\n').length + (lineNum > 1 ? 1 : 0);
        editor.focus();
        editor.selectionStart = editor.selectionEnd = pos;
        editor.scrollTop = editor.scrollHeight * ((lineNum - 1) / lines.length);
      }

      async function search() {
        const query = $('search').value.trim();
        if (!query) return;
        try {
          setMessage('Searching...');
          const data = await api(`/api/search?q=${encodeURIComponent(query)}`);
          $('search-results').innerHTML = data.results.length ? data.results.map((result) => `
            <button data-search-path="${escapeAttr(result.path)}">
              <div class="where">${escapeHTML(result.path)}:${result.line}:${result.column}</div>
              <div class="preview">${escapeHTML(result.preview)}</div>
            </button>`).join('') : '<p>No matches</p>';
          for (const button of document.querySelectorAll('[data-search-path]')) {
            button.addEventListener('click', () => selectFile(button.dataset.searchPath));
          }
          setMessage(`${data.results.length} matches`, 'ok');
        } catch (error) {
          setMessage(error.message, 'error');
        }
      }

      function renderDiff(diff) {
        return diff.split('\n').map((line) => {
          let cls = 'diff-line';
          if (line.startsWith('+') && !line.startsWith('+++')) cls += ' diff-add';
          if (line.startsWith('-') && !line.startsWith('---')) cls += ' diff-del';
          if (line.startsWith('@@')) cls += ' diff-hunk';
          return `<span class="${cls}">${escapeHTML(line)}</span>`;
        }).join('\n');
      }

      function setMessage(text, type = '') {
        $('message').textContent = text;
        $('message').className = `message ${type}`;
      }

      function formatDate(value) {
        const date = new Date(value);
        if (Number.isNaN(date.getTime())) return value;
        return date.toLocaleString();
      }

      function escapeHTML(value) {
        return String(value).replace(/[&<>"]/g, (char) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[char]));
      }

      function escapeAttr(value) {
        return escapeHTML(value).replace(/'/g, '&#39;');
      }
    </script>
  </body>
</html>
