<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, interactive-widget=resizes-content" />
    <title>MindGit</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css" id="hljs-dark">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github.min.css" id="hljs-light" disabled>
    <script>
      (() => {
        try {
          const params = new URLSearchParams(window.location.search);
          const isEmbed = params.get('embed') === '1';
          if (isEmbed) {
            document.documentElement.dataset.embed = 'true';
            document.documentElement.dataset.viewerOpen = 'true';
          }
          const storedTheme = localStorage.getItem('mindgit-theme');
          const hasStoredTheme = storedTheme === 'dark' || storedTheme === 'light';
          const theme = hasStoredTheme
            ? storedTheme
            : (window.matchMedia?.('(prefers-color-scheme: dark)')?.matches ? 'dark' : 'light');
          document.documentElement.dataset.theme = theme;
          document.documentElement.style.colorScheme = theme;
          window.__mindgitInitialTheme = theme;
          window.__mindgitInitialEmbed = isEmbed;
          const darkStyle = document.getElementById('hljs-dark');
          const lightStyle = document.getElementById('hljs-light');
          if (darkStyle) darkStyle.disabled = theme !== 'dark';
          if (lightStyle) lightStyle.disabled = theme === 'dark';
        } catch {}
      })();
    </script>
    <style>
      html[data-embed="true"],
      html[data-embed="true"] body {
        height: 100%;
        margin: 0;
        overflow: hidden;
      }
      html[data-embed="true"] header,
      html[data-embed="true"] aside,
      html[data-embed="true"] .review,
      html[data-embed="true"] footer,
      html[data-embed="true"] .layout-resizer,
      html[data-embed="true"] .split-pane-resizer {
        display: none !important;
      }
      html[data-embed="true"] .app {
        height: 100%;
      }
      html[data-embed="true"] main,
      html[data-embed="true"] section,
      html[data-embed="true"] .viewer-split-area {
        height: 100%;
        min-height: 0;
      }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <link rel="stylesheet" href="/vendor/mxgraph/css/common.css" />
    <link rel="stylesheet" href="/vendor/xterm/xterm.css" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="app">
      <header>
        <div class="brand">MindGit</div>
        <div class="view-toggle">
          <button id="worktree-view" class="active" type="button">Working Tree</button>
          <button id="history-view" type="button">History</button>
        </div>
        <div class="stat">Branch: <strong id="branch">-</strong></div>
        <div class="stat">Modified: <strong id="modified">0</strong></div>
        <div class="stat">Added: <strong id="added">0</strong></div>
        <div class="stat">Deleted: <strong id="deleted">0</strong></div>
        <div class="stat"><strong id="lines">+0 -0</strong></div>
        <button id="theme-toggle" type="button">Light</button>
        <button id="runtime-stats" type="button">Runtime</button>
        <button id="refresh" type="button">Refresh</button>
        <div class="grow"></div>
        <form class="search" id="search-form">
          <input id="search" placeholder="Search with keyword" autocomplete="off" />
          <button type="submit">Search</button>
        </form>
      </header>

      <main>
        <aside>
          <div class="pane-title">
            <div class="pane-title-main">
              <button id="project-switcher" class="project-switcher" type="button" hidden>
                <span id="project-switcher-label" class="project-switcher-label"></span>
              </button>
              <span id="change-title">Changes (0)</span>
            </div>
            <button id="tree-root-menu" class="pane-action" type="button" title="Root actions">...</button>
          </div>
          <div class="file-list" id="file-list"></div>
        </aside>
        <div class="layout-resizer layout-resizer-vertical" id="left-pane-resizer" aria-hidden="true"></div>

        <section>
          <div class="viewer-split-area" id="viewer-split-area">
            <div class="editor-pane primary-editor-pane">
              <div class="file-tabs" id="file-tabs"></div>
              <div id="viewer"><div class="empty">No file selected</div></div>
            </div>
            <div class="split-pane-resizer" id="split-pane-resizer" hidden aria-hidden="true"></div>
            <div class="split-pane-host" id="split-pane-host" hidden></div>
          </div>
        </section>
        <div class="layout-resizer layout-resizer-vertical" id="right-pane-resizer" aria-hidden="true"></div>

        <div class="review">
          <div class="pane-title"><span>Review</span></div>
          <div class="review-body">
            <div class="card">
              <h3>File Review</h3>
              <p id="review-summary">选择文件后，这里会显示变更摘要、风险提示和快速操作入口。</p>
            </div>
            <div class="card">
              <h3>Search Results</h3>
              <div class="search-results" id="search-results"><p>输入关键词后全局搜索。</p></div>
            </div>
          </div>
        </div>
      </main>

      <div id="terminal-panel" class="terminal-panel" hidden>
        <div id="terminal-resizer" class="terminal-resizer" aria-hidden="true"></div>
        <div class="terminal-toolbar">
          <div id="terminal-tabs" class="terminal-tabs" role="tablist"></div>
          <button id="terminal-select" class="terminal-tool-button" type="button" title="Select terminal text" aria-label="Select terminal text">⧉</button>
          <button id="terminal-new" class="terminal-tool-button" type="button" title="New terminal" aria-label="New terminal">+</button>
          <button id="terminal-keys-toggle" class="terminal-tool-button" type="button" title="Show extra keys" aria-label="Show extra keys">⌨</button>
          <button id="terminal-hide" class="terminal-tool-button" type="button" title="Hide terminal" aria-label="Hide terminal">⌄</button>
        </div>
        <div id="terminal-hosts" class="terminal-hosts"></div>
        <div id="terminal-extra-keys" class="terminal-extra-keys" hidden>
          <button type="button" data-terminal-key="escape">ESC</button>
          <button type="button" data-terminal-modifier="alt">ALT</button>
          <button type="button" data-terminal-key="home">HOME</button>
          <button type="button" data-terminal-key="up">↑</button>
          <button type="button" data-terminal-key="end">END</button>
          <button type="button" data-terminal-key="pageup">PAGEUP</button>
          <button type="button" data-terminal-key="tab">TAB</button>
          <button type="button" data-terminal-modifier="ctrl">CTRL</button>
          <button type="button" data-terminal-key="left">←</button>
          <button type="button" data-terminal-key="down">↓</button>
          <button type="button" data-terminal-key="right">→</button>
          <button type="button" data-terminal-key="pagedown">PAGEDOWN</button>
        </div>
      </div>

      <footer>
        <span id="root">-</span>
        <span class="message" id="message"></span>
      </footer>
    </div>

    <div id="login-dialog" class="prompt-dialog-backdrop auth-dialog-backdrop" hidden>
      <form id="login-form" class="prompt-dialog auth-dialog" autocomplete="off">
        <h2 class="prompt-dialog-title">Unlock MindGit</h2>
        <p class="prompt-dialog-message">Enter the access password configured for this MindGit instance.</p>
        <input id="login-password" class="prompt-dialog-field" type="password" minlength="8" autocomplete="current-password" required />
        <p id="login-error" class="dialog-error" role="alert"></p>
        <div class="prompt-dialog-actions">
          <button id="login-submit" class="primary" type="submit">Unlock</button>
        </div>
      </form>
    </div>

    <div id="runtime-dialog" class="prompt-dialog-backdrop" hidden>
      <div class="prompt-dialog runtime-dialog" role="dialog" aria-modal="true" aria-labelledby="runtime-dialog-title">
        <div class="dialog-title-row">
          <h2 id="runtime-dialog-title" class="prompt-dialog-title">MindGit Runtime</h2>
          <button id="runtime-close" type="button" aria-label="Close runtime information">×</button>
        </div>
        <p id="runtime-error" class="dialog-error" role="alert"></p>
        <div id="runtime-grid" class="runtime-grid"></div>
      </div>
    </div>

    <script src="/utils.js"></script>
    <script src="/history.js"></script>
    <script src="/tree.js"></script>
    <script src="/structured_interactions.js"></script>
    <script>window.mxBasePath = '/vendor/mxgraph';</script>
    <script src="/vendor/mxgraph/mxClient.min.js"></script>
    <script src="/drawio.js"></script>
    <script src="/km.js"></script>
    <script src="/xmind.js"></script>
    <script src="/structured.js"></script>
    <script src="/viewer.js"></script>
    <script src="/editor.js"></script>
    <script src="/vendor/xterm/xterm.js"></script>
    <script src="/vendor/xterm/xterm-addon-fit.js"></script>
    <script src="/terminal.js"></script>
    <script src="/app.js"></script>
  </body>
</html>
