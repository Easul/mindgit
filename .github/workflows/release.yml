name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Test
        run: go test ./...

      - name: Build stripped release artifacts
        run: scripts/build.sh

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/mindgit-linux-amd64
            dist/mindgit-linux-amd64.tar.gz
            dist/mindgit-linux-armv7
            dist/mindgit-linux-armv7.tar.gz
            dist/mindgit-darwin-amd64
            dist/mindgit-darwin-amd64.tar.gz
            dist/mindgit-windows-amd64.exe
            dist/mindgit-windows-amd64.zip
            dist/mindgit-android-arm64
            dist/mindgit-android-arm64.tar.gz
            dist/SHA256SUMS
